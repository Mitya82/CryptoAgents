name: Check Python Syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas pandas-ta python-telegram-bot python-dotenv
    
    - name: Check syntax
      run: |
        python -m py_compile agent_001/agent_base_v1.py
        python -m py_compile agent_001/telegram_notifier.py
        python -m py_compile agent_001/config.py
        # проверяем все .py в проекте, кроме виртуальных окружений
        find . -name '*.py' -not -path './.venv/*' -not -path './venv/*' -print0 | xargs -0 python -m py_compile